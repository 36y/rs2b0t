name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun test

      # Not gates yet. tsc is at 26 errors and eslint at 82, all predating this
      # workflow, so blocking on either would mean a permanently red main and a
      # signal everyone learns to ignore. Reported here so the counts are visible
      # and can only go down; promote to real gates once they reach zero.
      - name: typecheck (informational)
        if: always()
        run: bun run typecheck
        continue-on-error: true

      - name: lint (informational)
        if: always()
        run: bun run lint
        continue-on-error: true
